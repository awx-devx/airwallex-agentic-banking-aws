[project]
name = "awx-k3-incident"
version = "0.1.0"
description = "Kit 3 domain core: Payment Ops Incident Commander (finality allowlist, duplicate lock)"
requires-python = ">=3.12,<3.13"
dependencies = ["awx-common"]

[tool.uv.sources]
awx-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awx_k3_incident"]
