[project]
name = "awx-k6-payroll"
version = "0.1.0"
description = "Kit 6 Multi-Employer Payroll Executor: per-employer pricing, funding, payouts and postconditions"
requires-python = ">=3.12,<3.13"
dependencies = ["awx-common"]

[tool.uv.sources]
awx-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awx_k6_payroll"]
