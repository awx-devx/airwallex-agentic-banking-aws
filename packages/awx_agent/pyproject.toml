[project]
name = "awx-agent"
version = "0.1.0"
description = "Agent plane: AgentCore Runtime entrypoint, Gateway tool handlers, registry, awxpoc CLI"
requires-python = ">=3.12,<3.13"
# strands-agents and bedrock-agentcore run the agent. boto3 serves the tool handlers and
# the CLI. aws-cdk-lib is needed only by awx_agent.registry, which imports it lazily.
dependencies = [
    "awx-common",
    "awx-spine-aws",
    "strands-agents==1.58.0",
    "bedrock-agentcore==1.24.0",
    "boto3==1.43.108",
    # Token verification (awx_agent.jwtverify). Same versions uv.lock already resolves through
    # mcp (pyjwt) and moto (cryptography); bundled into Lambda assets as linux/arm64 wheels.
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
cdk = ["aws-cdk-lib==2.272.0", "constructs==10.8.1"]

[project.scripts]
awxpoc = "awx_agent.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awx_agent"]

[tool.uv.sources]
awx-common = { workspace = true }
awx-spine-aws = { workspace = true }
