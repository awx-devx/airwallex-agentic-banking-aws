[project]
name = "awx-spine"
version = "0.1.0"
description = "Airwallex sandbox client, mutation executor, operation store, finality polling and FakeAirwallex"
requires-python = ">=3.12,<3.13"
dependencies = ["awx-common"]

[tool.uv.sources]
awx-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awx_spine"]
